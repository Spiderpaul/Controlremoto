<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Control PWA</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#00adb5">

    <link rel="stylesheet" href="style.css">
</head>
<body ontouchstart="">

    <div class="tabs-container">
        <button class="tab-btn active" id="tabGamepad">🎮 Mando</button>
        <button class="tab-btn" id="tabTeclado">⌨️ Teclado</button>
    </div>

    <div id="vistaGamepad" class="vista-seccion">
        <div class="dpad-container">
            <button class="dbtn btn-up" id="btnIzquierda">▲</button> 
            <button class="dbtn btn-left" id="btnAbajo">◀</button>  
            <button class="dbtn btn-right" id="btnArriba">▶</button> 
            <button class="dbtn btn-down" id="btnDerecha">▼</button> 
        </div>

        <button class="btn-play" id="botonA">A</button>
    </div>

    <div id="vistaTeclado" class="vista-seccion oculto">
        <input type="text" id="inputTeclado" autocomplete="off" autocapitalize="none" placeholder="Toca abajo para escribir...">
        
        <div id="trackpad" class="area-trackpad">
            <span>ÁREA DE ESCRITURA<br><br>⌨️ Toca aquí para abrir teclado ⌨️</span>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. REGISTRO DEL SERVICE WORKER (Intacto)
        // ==========================================
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js')
                .then(() => console.log("Service Worker registrado con éxito."))
                .catch(err => console.error("Error al registrar SW:", err));
        }

        // ==========================================
        // 2. CONEXIÓN AL TÚNEL WEBSOCKET (Intacto)
        // ==========================================
        const URL_WEBSOCKET = 'ws://192.168.100.14:80'; 
        const socket = new WebSocket(URL_WEBSOCKET);

        socket.onopen = () => console.log("¡Conectado exitosamente al servidor por WebSocket!");
        socket.onerror = (error) => console.error("Error en el WebSocket:", error);
        socket.onclose = () => console.log("Conexión WebSocket cerrada.");

        // ==========================================
        // 3. MAPEO Y EVENTOS DE TU MANDO (Intacto)
        // ==========================================
        const botones = {
            'btnArriba': 'UP',
            'btnAbajo': 'DOWN',
            'btnIzquierda': 'LEFT',
            'btnDerecha': 'RIGHT',
            'botonA': 'A' 
        };

        Object.keys(botones).forEach(id => {
            const el = document.getElementById(id);
            const comando = botones[id];

            if (el) {
                el.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    enviarComando(`${comando}_DOWN`);
                });

                el.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    enviarComando(`${comando}_UP`);
                });

                el.addEventListener('mousedown', () => enviarComando(`${comando}_DOWN`));
                el.addEventListener('mouseup', () => enviarComando(`${comando}_UP`));
            }
        });

        // ==========================================
        // 4. LÓGICA DE INTERCAMBIO DE PESTAÑAS (Nuevo)
        // ==========================================
        const tabGamepad = document.getElementById('tabGamepad');
        const tabTeclado = document.getElementById('tabTeclado');
        const vistaGamepad = document.getElementById('vistaGamepad');
        const vistaTeclado = document.getElementById('vistaTeclado');
        const inputTeclado = document.getElementById('inputTeclado');
        const trackpad = document.getElementById('trackpad');

        tabGamepad.addEventListener('click', () => {
            tabGamepad.classList.add('active');
            tabTeclado.classList.remove('active');
            vistaGamepad.classList.remove('oculto');
            vistaTeclado.classList.add('oculto');
            inputTeclado.blur(); // Oculta el teclado si se cambia de pestaña
        });

        tabTeclado.addEventListener('click', () => {
            tabTeclado.classList.add('active');
            tabGamepad.classList.remove('active');
            vistaTeclado.classList.remove('oculto');
            vistaGamepad.classList.add('oculto');
        });

        // Al hacer clic en el área oscura, forzamos el foco en el input para abrir Gboard
        trackpad.addEventListener('click', () => {
            inputTeclado.focus();
        });

        // ==========================================
        // 5. SISTEMA DE TECLADO INTELIGENTE (Versión Espejo)
        // ==========================================
        let textoAnterior = "";

        inputTeclado.addEventListener('input', (e) => {
            const textoActual = inputTeclado.value;

            // Caso 1: El usuario escribió algo nuevo (añadió texto)
            if (textoActual.length > textoAnterior.length) {
                // Conseguimos exactamente lo último que se escribió (puede ser una letra, un signo o un emoji)
                const caracteresNuevos = textoActual.slice(textoAnterior.length);
                
                // Si es un salto de línea (Enter en Gboard), mandamos un Enter a la PC
                if (e.inputType === 'insertLineBreak' || caracteresNuevos === '\n') {
                    enviarComando("TECLA:ENTER");
                    inputTeclado.value = ""; // Limpiamos solo al dar Enter completo
                    textoAnterior = "";
                    return;
                }

                // Enviamos el carácter o caracteres exactos a la PC de inmediato
                enviarComando(`TEXTO:${caracteresNuevos}`);
            } 
            // Caso 2: El usuario borró algo
            else if (textoActual.length < textoAnterior.length) {
                const diferencia = textoAnterior.length - textoActual.length;
                // Mandamos tantos borrados como caracteres se hayan eliminado de golpe
                for (let i = 0; i < diferencia; i++) {
                    enviarComando("TECLA:BACKSPACE");
                }
            }

            // Actualizamos el estado del espejo
            textoAnterior = inputTeclado.value;
        });

        // Botón de seguridad: Si el cuadro se llena mucho, un doble clic en el trackpad lo limpia
        trackpad.addEventListener('dblclick', () => {
            inputTeclado.value = "";
            textoAnterior = "";
        });
    </script>
</body>
</html>
